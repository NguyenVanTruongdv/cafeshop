name: CI/CD Full

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # ========================
  # CI: BUILD + TEST
  # ========================
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ===== FRONTEND =====
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Frontend
        working-directory: Frontend
        run: npm install

      - name: Build Frontend
        working-directory: Frontend
        run: npm run build

      # ===== BACKEND =====
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore Backend
        run: dotnet restore Backend/CafeShopAPI/CafeShopAPI.csproj

      - name: Build Backend
        run: dotnet build Backend/CafeShopAPI/CafeShopAPI.csproj --no-restore

      - name: Test Backend
        run: dotnet test Backend/CafeShopAPI/CafeShopAPI.csproj --no-build

  # ========================
  # CD: DEPLOY
  # ========================
  cd:
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ===== FRONTEND (VERCEL) =====
      - name: Deploy Frontend
        working-directory: Frontend
        run: |
          npx vercel --prod --yes \
          --token=${{ secrets.VERCEL_TOKEN }} \
          --scope=${{ secrets.VERCEL_ORG_ID }} \
          --project=${{ secrets.VERCEL_PROJECT_ID }}

      # ===== BACKEND (RENDER) =====
      - name: Trigger Render Deploy
        run: |
          echo "Deploying Backend to Render..."
          curl -X POST "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys" \
          -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
          -H "Accept: application/json"
